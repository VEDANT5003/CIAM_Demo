<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>CIAM Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(120% 100% at 50% -10%, #12234d, #070d1c);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Floating gradient orbs */
    .orb {
      position: absolute;
      width: 240px;
      height: 240px;
      background: linear-gradient(145deg, #3ea3ff, #7f5bff);
      filter: blur(40px);
      opacity: 0.25;
      border-radius: 50%;
      animation: float 10s ease-in-out infinite;
    }

    .orb:nth-child(1) { top: 5%; left: 10%; animation-delay: 0s; }
    .orb:nth-child(2) { bottom: 5%; right: 10%; animation-delay: 3s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); }
      50% { transform: translateY(-25px) translateX(25px); }
    }

    .card {
      position: relative;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 32px 40px;
      max-width: 520px;
      width: 92%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      animation: fadeIn 0.9s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.9rem;
    }

    p {
      margin: 4px 0 20px;
      opacity: 0.9;
    }

    .timer {
      margin-top: 10px;
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #6edcff;
    }

    .note {
      margin-top: 18px;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <!-- Background animation orbs -->
  <div class="orb"></div>
  <div class="orb"></div>

  <div class="card">
    <h1>Welcome to CIAM Demo</h1>

    <p>Your AWS account is being prepared.</p>
    <p>It will be active within the next:</p>

    <div class="timer" id="timer">60:00</div>

    <div class="note">
      You may safely close this window — we’ll email you once provisioning is complete.
    </div>
  </div>

  <script>
    // Start a 60-minute countdown (60 * 60 seconds)
    let remaining = 60 * 60;

    const timerElement = document.getElementById("timer");

    function updateTimer() {
      const minutes = Math.floor(remaining / 60);
      const seconds = remaining % 60;

      timerElement.textContent =
        String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");

      if (remaining > 0) {
        remaining--;
      }
    }

    // Update immediately then every second
    updateTimer();
    setInterval(updateTimer, 1000);
  </script>

</body>
</html>
