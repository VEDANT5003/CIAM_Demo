<!DOCTYPE html>
<html>
<head>
  <title>CIAM Demo</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: #fff;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .card {
      padding: 32px;
      border-radius: 12px;
      background: #111b33;
      box-shadow: 0 12px 30px rgba(0,0,0,.4);
      max-width: 480px;
      text-align: center;
    }
    h1 { margin-bottom: 10px; }
    p  { opacity: .9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to CIAM Demo</h1>
    <p>Your AWS account will be active within <strong>60 minutes</strong>.</p>
  </div>
</body>
</html>
